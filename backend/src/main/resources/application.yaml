spring:
  application:
    name: muruk-muruk

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false        # 컨트롤러까지 DB 연결을 붙들고 있지 않게 끔
    hibernate:
      ddl-auto: validate       # 테이블을 자동 생성하지 않고, 엔티티와 DB가 맞는지만 검사

  flyway:
    enabled: true              # 서버 시작 때 db/migration의 SQL을 실행

jwt:
  secret: ${JWT_SECRET}        # 서버가 발급하는 토큰의 서명 키 (32바이트 이상)
  access-token-ttl: PT24H      # 액세스 토큰 유효기간 (PT24H = 24시간)

google:
  client-id: ${GOOGLE_CLIENT_ID}   # 구글 ID 토큰이 우리 앱용인지 확인할 때 씀 (프론트와 같은 값)

app:
  cors:
    # 프론트 주소 허용. 기본값은 로컬 개발용, 배포 땐 Vercel 주소를 환경 변수로 넣어요
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}